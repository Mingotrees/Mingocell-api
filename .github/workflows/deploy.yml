name: Backend CI and deployment

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: backend-ci-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mingocell_test
          POSTGRES_USER: mingocell_test
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mingocell_test -d mingocell_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python for classifier input tests
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install canonical decoder version
        run: python -m pip install Pillow==13.0.0

      - name: Test and build
        env:
          TEST_DATABASE_URL: postgresql://mingocell_test:ci-test-only@127.0.0.1:5432/mingocell_test
          CLASSIFIER_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          test -n "$TEST_DATABASE_URL"
          test -x "$CLASSIFIER_PYTHON"
          npm test
          python3 tests/account-cli.py
          python3 tests/classifier-input.py
          test -f dist/server.js

      - name: Validate GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= .github/workflows/deploy.yml

      - name: Package tested runtime
        run: npm run package:runtime -- "$RUNNER_TEMP/backend-runtime"

      - name: Store tested runtime
        uses: actions/upload-artifact@v4
        with:
          name: backend-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/backend-runtime/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy backend to DCISM
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: dcism-backend-production
      cancel-in-progress: false
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Download tested runtime
        uses: actions/download-artifact@v4
        with:
          name: backend-runtime-${{ github.sha }}
          path: .

      - name: Deploy backend
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DCISM_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DCISM_KNOWN_HOSTS }}
          DCISM_HOST: ${{ secrets.DCISM_HOST }}
          DCISM_PORT: ${{ secrets.DCISM_PORT }}
          DCISM_USER: ${{ secrets.DCISM_USER }}
          DCISM_DEPLOY_PATH: ${{ secrets.DCISM_DEPLOY_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          # Validate destination before transferring or deleting compiled files.
          [[ "$DCISM_HOST" == "ver.dcism.org" ]]
          [[ "$DCISM_PORT" == "22072" ]]
          [[ "$DCISM_USER" == "s22101440" ]]
          [[ "$DCISM_DEPLOY_PATH" == "/data/users/s22101440/api-mingocell.dcism.org" ]]
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          install -d -m 700 "$HOME/.ssh"
          KEY_FILE=$(mktemp "$HOME/.ssh/dcism-key.XXXXXX")
          HOSTS_FILE=$(mktemp "$HOME/.ssh/dcism-hosts.XXXXXX")
          trap 'rm -f "$KEY_FILE" "$HOSTS_FILE"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOSTS_FILE"
          chmod 600 "$KEY_FILE" "$HOSTS_FILE"
          unset SSH_PRIVATE_KEY SSH_KNOWN_HOSTS

          SSH_COMMAND="ssh -i $KEY_FILE -p $DCISM_PORT"
          SSH_COMMAND+=" -o UserKnownHostsFile=$HOSTS_FILE"
          SSH_COMMAND+=" -o BatchMode=yes -o IdentitiesOnly=yes"
          SSH_COMMAND+=" -o StrictHostKeyChecking=yes -o ConnectTimeout=20"
          SSH_COMMAND+=" -o ServerAliveInterval=30 -o ServerAliveCountMax=3"
          TARGET="$DCISM_USER@$DCISM_HOST"

          # Confirm existing deployment and tools before changing files.
          $SSH_COMMAND "$TARGET" "bash -se" <<'REMOTE'
          set -euo pipefail
          cd /data/users/s22101440/api-mingocell.dcism.org
          test -w .
          for tool in node npm pm2 rsync curl; do
            command -v "$tool" >/dev/null
          done
          node -e 'if (Number(process.versions.node.split(".")[0]) < 24) process.exit(1)'
          node --env-file-if-exists=.env -e '
            const fs = require("node:fs");
            if ((process.env.SESSION_SECRET ?? "").length < 32) {
              console.error("Set SESSION_SECRET in server .env before deploying authentication.");
              process.exit(1);
            }
            const expected = "/data/users/s22101440/mingocell-storage";
            const root = process.env.IMAGE_STORAGE_ROOT || expected;
            if (root !== expected) {
              console.error(`IMAGE_STORAGE_ROOT must be ${expected} on DCISM.`);
              process.exit(1);
            }
            for (const directory of [root, `${root}/originals`, `${root}/previews`, `${root}/tmp`]) {
              fs.mkdirSync(directory, { recursive: true, mode: 0o700 });
              if (!fs.lstatSync(directory).isDirectory() || fs.lstatSync(directory).isSymbolicLink()) {
                console.error(`${directory} must be a real directory, not a symlink.`);
                process.exit(1);
              }
              fs.chmodSync(directory, 0o700);
              fs.accessSync(directory, fs.constants.R_OK | fs.constants.W_OK | fs.constants.X_OK);
            }
          '
          pm2 describe mingocell-api >/dev/null
          REMOTE

          # Stage new code first. Live worker must drain before dist/ replacement.
          $SSH_COMMAND "$TARGET" 'install -d -m 700 /data/users/s22101440/api-mingocell.dcism.org/.classifier-analysis-stage'
          rsync -az --delete-delay --delay-updates --timeout=120 \
            -e "$SSH_COMMAND" dist/ "$TARGET:$DCISM_DEPLOY_PATH/.classifier-analysis-stage/dist/"
          rsync -az --delay-updates --timeout=120 \
            -e "$SSH_COMMAND" package.json package-lock.json "$TARGET:$DCISM_DEPLOY_PATH/.classifier-analysis-stage/"
          rsync -az --delay-updates --timeout=120 \
            -e "$SSH_COMMAND" migrations/ "$TARGET:$DCISM_DEPLOY_PATH/.classifier-analysis-stage/migrations/"
          rsync -az --delay-updates --timeout=120 \
            -e "$SSH_COMMAND" scripts/ "$TARGET:$DCISM_DEPLOY_PATH/.classifier-analysis-stage/scripts/"
          rsync -az --delay-updates --timeout=120 \
            -e "$SSH_COMMAND" deploy/ "$TARGET:$DCISM_DEPLOY_PATH/.classifier-analysis-stage/deploy/"

          $SSH_COMMAND "$TARGET" "bash -se" <<'REMOTE'
          set -euo pipefail
          cd /data/users/s22101440/api-mingocell.dcism.org
          node --env-file-if-exists=.env .classifier-analysis-stage/deploy/check-analysis-worker.mjs --preflight
          export ANALYSIS_PREVIOUS_INSTANCE
          ANALYSIS_PREVIOUS_INSTANCE=$(node --env-file-if-exists=.env --input-type=module -e '
            import {pool} from "./dist/database/pool.js";
            try {
              const exists = await pool.query("SELECT to_regclass($1) AS name", ["mingocell_data.classification_worker"]);
              if (exists.rows[0].name) {
                const row = await pool.query("SELECT instance_id FROM mingocell_data.classification_worker");
                process.stdout.write(row.rows[0]?.instance_id || "");
              }
            } finally { await pool.end(); }
          ')
          trap 'printf "%s\n" "Deployment interrupted; check mingocell-classification-worker before resuming analysis." >&2' ERR
          if pm2 describe mingocell-classification-worker >/dev/null 2>&1; then
            pm2 stop mingocell-classification-worker
          fi
          rsync -a --delete-delay .classifier-analysis-stage/dist/ dist/
          rsync -a .classifier-analysis-stage/package.json .classifier-analysis-stage/package-lock.json ./
          rsync -a .classifier-analysis-stage/migrations/ migrations/
          rsync -a .classifier-analysis-stage/scripts/ scripts/
          rsync -a .classifier-analysis-stage/deploy/ deploy/
          npm ci --omit=dev
          npm run migrate
          pm2 restart mingocell-api --update-env
          pm2 startOrRestart deploy/ecosystem.config.cjs --update-env
          for attempt in {1..15}; do
            if node --env-file-if-exists=.env deploy/check-analysis-worker.mjs; then break; fi
            if [[ "$attempt" == 15 ]]; then exit 1; fi
            sleep 2
          done
          curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
            --retry 10 --retry-delay 2 --retry-all-errors --retry-max-time 90 \
            http://127.0.0.1:20282/health/live
          curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
            --retry 10 --retry-delay 2 --retry-all-errors --retry-max-time 90 \
            http://127.0.0.1:20282/health/ready
          REMOTE

          curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
            --retry 10 --retry-delay 2 --retry-all-errors --retry-max-time 90 \
            https://api-mingocell.dcism.org/health/live \
            | node --input-type=module -e '
              import assert from "node:assert/strict";
              let body = "";
              for await (const chunk of process.stdin) body += chunk;
              assert.deepEqual(JSON.parse(body), { status: "ok", service: "mingocell-api" });
              console.log("Public API health check passed");
            '

          # Confirm Apache forwards HTTPS correctly and the browser can get a secure cookie.
          node --input-type=module -e '
            import assert from "node:assert/strict";
            const response = await fetch("https://api-mingocell.dcism.org/api/v1/auth/session", {
              headers: { Origin: "https://mingocells.dcism.org" },
              signal: AbortSignal.timeout(10000),
            });
            assert.equal(response.status, 200);
            const cookie = response.headers.get("set-cookie") ?? "";
            assert.ok(cookie.startsWith("__Host-mingocell.sid="), "Missing production session cookie");
            assert.ok(cookie.includes("; Secure") && cookie.includes("; HttpOnly"), "Invalid cookie flags");
            const session = await response.json();
            assert.equal(session.user, null);
            assert.ok(/^[a-f0-9]{64}$/.test(session.csrfToken), "Missing CSRF bootstrap token");
            console.log("Public authentication bootstrap passed");
          '
